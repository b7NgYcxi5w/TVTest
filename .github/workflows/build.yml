name: Build TVTest

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch: # 手動実行を有効化

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # NuGetパッケージの復元が必要な場合（依存関係エラー対策）
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet Packages
        run: nuget restore src/TVTest.sln
        # ※ slnファイルの場所がリポジトリ直下なら "TVTest.sln" や "TVTest/TVTest.sln" に変更してください

      - name: Build x86 (Release)
        run: |
          msbuild src/TVTest.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build x64 (Release)
        run: |
          msbuild src/TVTest.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVTest-Binaries
          path: |
            src/Release/
            src/x64/Release/
