name: Build TVTest

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch: # GitHub上で手動実行できるようにする

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x86, x64] # 必要に応じてどちらか一方に絞ることも可能

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'DBCTRADO/TVTest'
          ref: 'develop' # 必要に応じて master やタグに変更
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TVTest solution
        run: |
          msbuild src\TVTest.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m
        shell: cmd

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVTest-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            src/${{ matrix.platform }}/${{ matrix.configuration }}/*.exe
            src/${{ matrix.platform }}/${{ matrix.configuration }}/*.dll
          
