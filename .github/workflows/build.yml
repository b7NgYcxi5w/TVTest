name: Build TVTest

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # リポジトリ内のどこに sln があるかによってパスを変更してください
      # 例: リポジトリの直下にあるなら "TVTest.sln"、srcフォルダ内なら "src/TVTest.sln"
      - name: Restore NuGet Packages
        run: nuget restore TVTest.sln

      - name: Build x86 (Release)
        run: |
          msbuild TVTest.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build x64 (Release)
        run: |
          msbuild TVTest.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVTest-Binaries
          path: |
            Release/
            x64/Release/
